[package]
name = "git-workset"
version = "0.6.2"
edition = "2021"
description = "Named sparse-checkout profiles for git worktrees with submodule and LFS management"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
toml = "0.8"
