name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --verbose

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package binary (Unix)
        if: "!contains(matrix.target, 'windows')"
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../git-workset-${{ matrix.target }}.tar.gz git-workset
          cd ../../..
          shasum -a 256 git-workset-${{ matrix.target }}.tar.gz > git-workset-${{ matrix.target }}.tar.gz.sha256
        shell: bash

      - name: Package binary (Windows)
        if: contains(matrix.target, 'windows')
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../git-workset-${{ matrix.target }}.zip git-workset.exe
          cd ../../..
          certutil -hashfile git-workset-${{ matrix.target }}.zip SHA256 | findstr /v "hash" > git-workset-${{ matrix.target }}.zip.sha256
        shell: cmd

      - name: Upload artifact (Unix)
        if: "!contains(matrix.target, 'windows')"
        uses: actions/upload-artifact@v4
        with:
          name: git-workset-${{ matrix.target }}
          path: |
            git-workset-${{ matrix.target }}.tar.gz
            git-workset-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact (Windows)
        if: contains(matrix.target, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: git-workset-${{ matrix.target }}
          path: |
            git-workset-${{ matrix.target }}.zip
            git-workset-${{ matrix.target }}.zip.sha256

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Generate release notes from commits
        id: notes
        run: |
          # Find the previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${{ github.ref_name }}"
          else
            RANGE="${{ github.ref_name }}"
          fi
          # Build notes from commit subjects (skip version bump / tag / internal commits)
          NOTES=$(git log --pretty=format:"- %s" "$RANGE" --no-merges | grep -v -i "^- bump version\|^- v[0-9]\|^- chore\|^- ci\|^- docs\|^- test" || true)
          if [ -z "$NOTES" ]; then
            NOTES="Maintenance release."
          fi
          # Write to file to preserve newlines
          echo "$NOTES" > /tmp/release-notes.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: /tmp/release-notes.txt
          files: |
            artifacts/git-workset-*.tar.gz
            artifacts/git-workset-*.zip
            artifacts/git-workset-*.sha256

  deploy-pages:
    name: Deploy GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version into page
        run: sed -i "s/__VERSION__/${{ github.ref_name }}/g" docs/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages

  deploy-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate and push formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          SHA_X86_DARWIN=$(awk '{print $1}' artifacts/git-workset-x86_64-apple-darwin.tar.gz.sha256)
          SHA_ARM_DARWIN=$(awk '{print $1}' artifacts/git-workset-aarch64-apple-darwin.tar.gz.sha256)
          SHA_X86_LINUX=$(awk '{print $1}' artifacts/git-workset-x86_64-unknown-linux-gnu.tar.gz.sha256)
          SHA_ARM_LINUX=$(awk '{print $1}' artifacts/git-workset-aarch64-unknown-linux-gnu.tar.gz.sha256)

          sed \
            -e "s/VERSION_PLACEHOLDER/${VERSION}/" \
            -e "s/SHA256_X86_DARWIN/${SHA_X86_DARWIN}/" \
            -e "s/SHA256_ARM_DARWIN/${SHA_ARM_DARWIN}/" \
            -e "s/SHA256_X86_LINUX/${SHA_X86_LINUX}/" \
            -e "s/SHA256_ARM_LINUX/${SHA_ARM_LINUX}/" \
            Formula/git-workset.rb > /tmp/git-workset.rb

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/lauripiispanen/homebrew-tap.git" /tmp/homebrew-tap
          cp /tmp/git-workset.rb /tmp/homebrew-tap/Formula/git-workset.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/git-workset.rb
          git commit -m "chore: bump git-workset to ${TAG}"
          git push
